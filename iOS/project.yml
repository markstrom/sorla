# Feasibility prototype for Sorla on iPhone (#65 benchmark harness, #66 Action Button toggle).
# Generate with `xcodegen generate --spec iOS/project.yml`; the .xcodeproj is never committed.
# The bundle identifiers are registered for device testing; the final identifiers for TestFlight are decided in #70.
name: SorlaiOS

options:
  bundleIdPrefix: com.sorla
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: V8K5F8X64N
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  # Exactly the version the Mac app resolves (Package.resolved: 0.16.1, b811a61569aa02691c99b808d08ee989b630c133).
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    exactVersion: 0.16.1

targets:
  Sorla:
    type: application
    platform: iOS
    sources:
      - path: Sorla
      - path: Shared
      - path: Benchmark/Utterances
        type: folder
        buildPhase: resources
        optional: true
      # Read-only reuse of the Mac app's platform-neutral core, compiled as is.
      # The shared-core extraction into a proper package is #67.
      - path: ../Sources/SorlaCore/AudioRecorder.swift
        group: SorlaCore
      - path: ../Sources/SorlaCore/CoreMLModelPreparer.swift
        group: SorlaCore
      - path: ../Sources/SorlaCore/ErrorSummary.swift
        group: SorlaCore
      - path: ../Sources/SorlaCore/FileVerifier.swift
        group: SorlaCore
      - path: ../Sources/SorlaCore/Localization.swift
        group: SorlaCore
      - path: ../Sources/SorlaCore/ModelInstallError.swift
        group: SorlaCore
      - path: ../Sources/SorlaCore/ModelInstaller.swift
        group: SorlaCore
      - path: ../Sources/SorlaCore/ModelManifest.swift
        group: SorlaCore
      - path: ../Sources/SorlaCore/ModelStaging.swift
        group: SorlaCore
      - path: ../Sources/SorlaCore/ModelSwap.swift
        group: SorlaCore
      - path: ../Sources/SorlaCore/PianissimoModel.swift
        group: SorlaCore
      - path: ../Sources/SorlaCore/RecordingLimit.swift
        group: SorlaCore
      - path: ../Sources/SorlaCore/SemanticVersion.swift
        group: SorlaCore
      - path: ../Sources/SorlaCore/SpectrumAnalyzer.swift
        group: SorlaCore
      - path: ../Sources/SorlaCore/TranscriptionEngine.swift
        group: SorlaCore
      - path: ../Sources/SorlaCore/URLSessionModelNetwork.swift
        group: SorlaCore
    dependencies:
      - package: FluidAudio
        product: FluidAudio
      - target: SorlaLiveActivity
        embed: true
    settings:
      base:
        PRODUCT_NAME: Sorla
        PRODUCT_BUNDLE_IDENTIFIER: com.sorla.ios
        INFOPLIST_FILE: Sorla/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) SORLA_APP
        ASSETCATALOG_COMPILER_APPICON_NAME: ""

  SorlaLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: LiveActivity
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: SorlaLiveActivity
        PRODUCT_BUNDLE_IDENTIFIER: com.sorla.ios.LiveActivity
        INFOPLIST_FILE: LiveActivity/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES

  SorlaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Sorla
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sorla.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Sorla.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Sorla
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  Sorla:
    build:
      targets:
        Sorla: all
        SorlaTests: [test]
    test:
      config: Debug
      targets:
        - SorlaTests
    run:
      config: Debug
    archive:
      config: Release
